name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unzip project
        run: |
          ZIP=$(ls *.zip | head -1)
          unzip -q "$ZIP" -d src
          echo "PROJ=$(dirname $(find src -name settings.gradle.kts | head -1))" >> $GITHUB_ENV

      - name: Build APK
        run: |
          cd "$PROJ"
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk $GITHUB_WORKSPACE/ullim.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 울림 빌드 ${{ github.run_number }}
          body: 아래 ullim.apk를 눌러 받은 뒤 설치하세요.
          files: ullim.apk
